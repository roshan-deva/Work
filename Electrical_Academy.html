<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Adaptive personal learning course for electrical and automation fundamentals">
  <title>Electrical &amp; Automation Academy: Personal Learning Course</title>
  <style>
:root {
  color-scheme: light;
  --ink: #1c1a3a;
  --ink-soft: #4a4870;
  --ink-faint: #6f6d95;
  --surface: #f7f7fb;
  --surface-raised: #ffffff;
  --surface-subtle: #eeedf7;
  --line: #dedcef;
  --line-strong: #b9b6d9;
  --nav: #201f5e;
  --nav-soft: #2c2a7c;
  --primary: #2c2a7c;
  --primary-strong: #1c1a5c;
  --primary-soft: #e6e5f5;
  --safety: #a92720;
  --safety-soft: #fff0ee;
  --safety-border: #e5b3ae;
  --caution: #956300;
  --caution-soft: #fff5d9;
  --success: #00a66c;
  --success-soft: #eafaf5;
  --accent: #12a8e1;
  --accent-soft: #dcf2f9;
  --focus: #12a8e1;
  --shadow: 0 18px 48px rgba(44, 42, 124, 0.1);
  --brand-rule: linear-gradient(to right, #00a679, #254089);
  --diagram-line: #6f6d95;
  --diagram-rail: #2c2a7c;
  --diagram-symbol-fill: #ffffff;
  --diagram-symbol-stroke: #4a4870;
  --topbar-bg: #ffffff;
  --topbar-ink: #1c1a3a;
  --topbar-ink-soft: #4a4870;
  --topbar-line: #dedcef;
  --topbar-hover: #eeedf7;
  --topbar-accent: #2c2a7c;
  --radius-lg: 18px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --text-scale: 1;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  font-family: "Segoe UI", Aptos, Arial, sans-serif;
  font-size: calc(16px * var(--text-scale));
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ink: #e9e8f5;
    --ink-soft: #b9b7d9;
    --ink-faint: #8b89b3;
    --surface: #0e0d24;
    --surface-raised: #17163a;
    --surface-subtle: #201f4a;
    --line: #302f5e;
    --line-strong: #47456f;
    --primary: #7fc9ea;
    --primary-strong: #a6dcf2;
    --primary-soft: #1c2d55;
    --safety: #ff8a80;
    --safety-soft: #3a1a17;
    --safety-border: #6b352f;
    --caution: #ffcf6b;
    --caution-soft: #3a2c08;
    --success: #5fe0ae;
    --success-soft: #103825;
    --accent: #5fd0f0;
    --accent-soft: #12324a;
    --focus: #5fd0f0;
    --shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
    --brand-rule: linear-gradient(to right, #2fce9e, #5fa0f0);
    --diagram-line: #9694c4;
    --diagram-rail: #7fc9ea;
    --diagram-symbol-fill: #201f4a;
    --diagram-symbol-stroke: #b9b7d9;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ink: #e9e8f5;
  --ink-soft: #b9b7d9;
  --ink-faint: #8b89b3;
  --surface: #0e0d24;
  --surface-raised: #17163a;
  --surface-subtle: #201f4a;
  --line: #302f5e;
  --line-strong: #47456f;
  --primary: #7fc9ea;
  --primary-strong: #a6dcf2;
  --primary-soft: #1c2d55;
  --safety: #ff8a80;
  --safety-soft: #3a1a17;
  --safety-border: #6b352f;
  --caution: #ffcf6b;
  --caution-soft: #3a2c08;
  --success: #5fe0ae;
  --success-soft: #103825;
  --accent: #5fd0f0;
  --accent-soft: #12324a;
  --focus: #5fd0f0;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
  --brand-rule: linear-gradient(to right, #2fce9e, #5fa0f0);
  --diagram-line: #9694c4;
  --diagram-rail: #7fc9ea;
  --diagram-symbol-fill: #201f4a;
  --diagram-symbol-stroke: #b9b7d9;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--surface);
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 85% -10%, rgba(18, 168, 225, 0.07), transparent 34rem),
    var(--surface);
  line-height: 1.55;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: not-allowed;
}

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 3px;
}

.skip-link {
  position: fixed;
  z-index: 100;
  top: 12px;
  left: 12px;
  padding: 10px 14px;
  color: #fff;
  background: var(--focus);
  border-radius: var(--radius-sm);
  transform: translateY(-160%);
  transition: transform 160ms var(--ease-out);
}

.skip-link:focus {
  transform: translateY(0);
}

.app-shell {
  min-height: 100vh;
}

.brand-rule {
  height: 4px;
  background: var(--brand-rule);
}

.topbar {
  position: sticky;
  z-index: 20;
  top: 0;
  display: flex;
  min-height: 76px;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 12px 24px;
  color: var(--topbar-ink);
  background: var(--topbar-bg);
  border-bottom: 1px solid var(--topbar-line);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  color: inherit;
  text-decoration: none;
}

.brand-mark {
  display: block;
  height: 40px;
  width: auto;
}

.brand strong,
.brand small {
  display: block;
}

.brand strong {
  color: var(--topbar-accent);
  font-size: 1rem;
  line-height: 1.2;
}

.brand small {
  margin-top: 2px;
  color: var(--topbar-ink-soft);
  font-size: 0.76rem;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.prototype-label {
  margin-right: 8px;
  color: var(--topbar-ink-soft);
  font-size: 0.78rem;
}

.icon-button,
.quiet-button {
  min-height: 40px;
  color: var(--topbar-ink-soft);
  background: transparent;
  border: 1px solid var(--topbar-line);
  border-radius: var(--radius-sm);
}

.icon-button {
  min-width: 42px;
  padding: 7px;
  font-weight: 700;
}

.quiet-button {
  padding: 7px 12px;
}

.quiet-button[aria-pressed="true"] {
  color: #fff;
  background: var(--topbar-accent);
  border-color: var(--topbar-accent);
}

.app-layout {
  display: grid;
  min-height: calc(100vh - 80px);
  grid-template-columns: 244px minmax(0, 1fr);
}

.sidebar {
  display: flex;
  position: sticky;
  top: 80px;
  height: calc(100vh - 80px);
  flex-direction: column;
  justify-content: space-between;
  padding: 24px 16px;
  color: #e6edf3;
  background: var(--nav);
  border-right: 1px solid rgba(255, 255, 255, 0.08);
}

.nav-label {
  margin: 0 12px 8px;
  color: #90a6b9;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.nav-label-secondary {
  margin-top: 28px;
}

.nav-item {
  display: flex;
  width: 100%;
  min-height: 44px;
  align-items: center;
  gap: 12px;
  margin: 3px 0;
  padding: 9px 12px;
  color: #dce8f1;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
  transition: background-color 160ms ease, color 160ms ease;
}

.nav-item > span {
  display: grid;
  width: 28px;
  height: 28px;
  place-items: center;
  color: #9bb2c5;
  background: rgba(255, 255, 255, 0.07);
  border-radius: 7px;
  font-size: 0.67rem;
  font-weight: 800;
}

.nav-item[aria-current="page"] {
  color: #fff;
  background: var(--nav-soft);
}

.nav-item[aria-current="page"] > span {
  color: #102337;
  background: #78d5e7;
}

.nav-item:disabled {
  color: #6f8496;
  opacity: 0.72;
}

.scope-note {
  display: flex;
  gap: 10px;
  margin: 14px 8px 0;
  padding-top: 18px;
  border-top: 1px solid rgba(255, 255, 255, 0.11);
}

.scope-note strong,
.scope-note span {
  display: block;
}

.scope-note strong {
  font-size: 0.78rem;
}

.scope-note span {
  color: #9fb2c3;
  font-size: 0.7rem;
}

.status-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 auto;
  margin-top: 6px;
  background: #6bd4a4;
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(107, 212, 164, 0.12);
}

#app-main {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 38px clamp(22px, 4vw, 64px) 72px;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 28px;
}

.page-header-copy {
  max-width: 760px;
}

.eyebrow {
  display: inline-block;
  margin: 0 0 10px;
  padding: 5px 12px;
  color: #fff;
  background: var(--success);
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1,
h2,
h3 {
  margin-top: 0;
  line-height: 1.18;
  letter-spacing: -0.025em;
}

h1 {
  margin-bottom: 12px;
  font-size: clamp(2rem, 4.5vw, 3.45rem);
}

h2 {
  margin-bottom: 10px;
  font-size: clamp(1.35rem, 2.3vw, 1.8rem);
}

h3 {
  margin-bottom: 8px;
  font-size: 1.05rem;
}

p {
  margin-top: 0;
}

.lede {
  max-width: 68ch;
  margin-bottom: 0;
  color: var(--ink-soft);
  font-size: 1.06rem;
}

.page-progress {
  min-width: 176px;
  padding-top: 8px;
}

.page-progress span {
  display: flex;
  justify-content: space-between;
  margin-bottom: 7px;
  color: var(--ink-soft);
  font-size: 0.75rem;
  font-weight: 700;
}

.progress-track {
  overflow: hidden;
  height: 7px;
  background: var(--surface-subtle);
  border-radius: 999px;
}

.progress-fill {
  height: 100%;
  background: var(--primary);
  border-radius: inherit;
  transition: transform 220ms var(--ease-in-out);
  transform: scaleX(var(--progress, 0));
  transform-origin: left;
}

.hero-grid,
.lesson-grid,
.practice-grid,
.dashboard-grid,
.review-grid {
  display: grid;
  gap: 22px;
}

.hero-grid {
  grid-template-columns: minmax(0, 1.2fr) minmax(310px, 0.8fr);
}

.lesson-grid {
  grid-template-columns: minmax(0, 1.25fr) minmax(280px, 0.75fr);
}

.practice-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.dashboard-grid {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}

.review-grid {
  grid-template-columns: minmax(0, 1.4fr) minmax(280px, 0.6fr);
}

.panel {
  min-width: 0;
  padding: clamp(20px, 3vw, 30px);
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
}

.panel-flat {
  box-shadow: none;
}

.safety-panel {
  background: var(--safety-soft);
  border-color: var(--safety-border);
}

.safety-label,
.caution-label,
.verified-label,
.neutral-label {
  display: inline-flex;
  align-items: center;
  min-height: 27px;
  margin-bottom: 14px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.safety-label {
  color: var(--safety);
  background: var(--safety-soft);
}

.caution-label {
  color: var(--caution);
  background: var(--caution-soft);
}

.verified-label {
  color: var(--success);
  background: var(--success-soft);
}

.neutral-label {
  color: var(--ink-soft);
  background: var(--surface-subtle);
}

.boundary-list,
.check-list,
.timeline,
.component-list,
.evidence-list {
  margin: 18px 0 0;
  padding: 0;
  list-style: none;
}

.boundary-list li,
.check-list li {
  position: relative;
  margin: 10px 0;
  padding-left: 28px;
}

.boundary-list li::before,
.check-list li::before {
  position: absolute;
  left: 0;
  color: var(--success);
  font-weight: 900;
  content: "✓";
}

.boundary-list li.stop::before {
  color: var(--safety);
  content: "×";
}

.path-list {
  display: grid;
  gap: 12px;
  margin: 22px 0 26px;
  padding: 0;
  list-style: none;
}

.path-list li {
  display: grid;
  grid-template-columns: 36px minmax(0, 1fr);
  gap: 12px;
  align-items: start;
}

.path-list strong,
.path-list span {
  display: block;
}

.path-list span {
  color: var(--ink-soft);
  font-size: 0.9rem;
}

.step-number {
  display: grid !important;
  width: 34px;
  height: 34px;
  place-items: center;
  color: var(--primary-strong) !important;
  background: var(--primary-soft);
  border-radius: 9px;
  font-size: 0.76rem !important;
  font-weight: 800;
}

.form-check {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr);
  gap: 11px;
  align-items: start;
  margin: 20px 0;
  padding: 16px;
  background: var(--surface-raised);
  border: 1px solid var(--safety-border);
  border-radius: var(--radius-md);
}

.form-check input {
  width: 20px;
  height: 20px;
  margin: 2px 0 0;
  accent-color: var(--primary);
}

.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-top: 22px;
}

.button-row > div {
  min-width: 0;
}

.button-row h2 {
  overflow-wrap: anywhere;
}

.button,
.button-secondary,
.button-quiet,
.choice-button,
.trace-button {
  min-height: 44px;
  border-radius: 10px;
  font-weight: 700;
  transition: transform 140ms var(--ease-out), background-color 160ms ease, border-color 160ms ease, color 160ms ease;
}

.button {
  padding: 10px 17px;
  color: #fff;
  background: var(--primary);
  border: 1px solid var(--primary);
}

.button:hover {
  background: var(--primary-strong);
  border-color: var(--primary-strong);
}

.button:disabled {
  color: var(--ink-faint);
  background: var(--surface-subtle);
  border-color: var(--line);
}

.button-secondary {
  padding: 10px 17px;
  color: var(--primary-strong);
  background: var(--surface-raised);
  border: 1px solid var(--line-strong);
}

.button-quiet {
  padding: 10px 14px;
  color: var(--ink-soft);
  background: transparent;
  border: 1px solid var(--line);
}

body[data-modality="pointer"] button:not(:disabled):active {
  transform: scale(0.97);
}

.microcopy {
  color: var(--ink-faint);
  font-size: 0.8rem;
}

.divider {
  height: 1px;
  margin: 24px 0;
  background: var(--line);
}

.question-card {
  max-width: 840px;
  margin: 0 auto;
}

.question-number {
  color: var(--primary-strong);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

legend {
  width: 100%;
  margin-bottom: 18px;
  font-size: 1.28rem;
  font-weight: 750;
  line-height: 1.35;
}

.choice-list {
  display: grid;
  gap: 10px;
}

.choice-button,
.trace-button {
  width: 100%;
  padding: 13px 15px;
  color: var(--ink);
  text-align: left;
  background: var(--surface-raised);
  border: 1px solid var(--line);
}

.choice-button:hover,
.trace-button:hover {
  border-color: var(--line-strong);
  background: var(--surface-subtle);
}

.choice-button[aria-pressed="true"],
.trace-button[aria-pressed="true"] {
  background: var(--primary-soft);
  border-color: var(--primary);
  box-shadow: inset 4px 0 0 var(--primary);
}

.choice-button[data-correct="true"] {
  background: var(--success-soft);
  border-color: var(--success);
  box-shadow: inset 4px 0 0 var(--success);
}

.choice-button[data-unsafe="true"] {
  background: var(--safety-soft);
  border-color: var(--safety);
  box-shadow: inset 4px 0 0 var(--safety);
}

.feedback {
  margin-top: 18px;
  padding: 16px 18px;
  border-left: 4px solid var(--primary);
  background: var(--primary-soft);
  border-radius: 0 var(--radius-md) var(--radius-md) 0;
}

.feedback.error {
  border-color: var(--safety);
  background: var(--safety-soft);
}

.feedback.success {
  border-color: var(--success);
  background: var(--success-soft);
}

.feedback.caution {
  border-color: var(--caution);
  background: var(--caution-soft);
}

.feedback p:last-child {
  margin-bottom: 0;
}

.learning-target {
  display: flex;
  gap: 14px;
  margin-bottom: 20px;
  padding: 15px 17px;
  background: var(--primary-soft);
  border-radius: var(--radius-md);
}

.target-icon {
  display: grid;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  place-items: center;
  color: #fff;
  background: var(--primary);
  border-radius: 9px;
  font-weight: 800;
}

.learning-target strong,
.learning-target span {
  display: block;
}

.learning-target span {
  color: var(--ink-soft);
  font-size: 0.88rem;
}

.concept-strip {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  margin: 18px 0;
}

.concept-step {
  min-width: 0;
  padding: 10px 7px;
  color: var(--ink-soft);
  text-align: center;
  background: var(--surface-subtle);
  border: 1px solid transparent;
  border-radius: 9px;
  font-size: 0.74rem;
  font-weight: 700;
}

.concept-step.active {
  color: var(--primary-strong);
  background: var(--primary-soft);
  border-color: var(--line-strong);
}

.diagram-shell {
  overflow: hidden;
  margin-top: 18px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

.diagram-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 14px;
  color: var(--ink-soft);
  background: var(--surface-subtle);
  border-bottom: 1px solid var(--line);
  font-size: 0.78rem;
}

.diagram-shell svg {
  display: block;
  width: 100%;
  height: auto;
  min-height: 260px;
}

.diagram-line {
  fill: none;
  stroke: var(--diagram-line);
  stroke-width: 4;
  stroke-linecap: round;
}

.diagram-line.active {
  stroke: var(--primary);
  stroke-width: 7;
}

.diagram-rail {
  stroke: var(--diagram-rail);
  stroke-width: 6;
}

.diagram-symbol {
  fill: var(--diagram-symbol-fill);
  stroke: var(--diagram-symbol-stroke);
  stroke-width: 3;
}

.diagram-symbol.active {
  fill: var(--primary-soft);
  stroke: var(--primary);
  stroke-width: 5;
}

.diagram-text {
  fill: var(--ink);
  font-family: "Segoe UI", Aptos, Arial, sans-serif;
  font-size: 17px;
  font-weight: 700;
}

.diagram-subtext {
  fill: var(--ink-soft);
  font-family: "Segoe UI", Aptos, Arial, sans-serif;
  font-size: 13px;
}

.trace-controls {
  display: grid;
  gap: 8px;
  margin-top: 16px;
}

.trace-button {
  display: flex;
  align-items: center;
  gap: 12px;
}

.trace-index {
  display: grid;
  width: 28px;
  height: 28px;
  flex: 0 0 auto;
  place-items: center;
  color: var(--primary-strong);
  background: var(--primary-soft);
  border-radius: 50%;
  font-size: 0.76rem;
}

details {
  margin-top: 18px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
}

summary {
  cursor: pointer;
  font-weight: 700;
}

details p,
details ol {
  margin-bottom: 0;
}

.state-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin: 18px 0;
}

.state-cell {
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}

.state-cell span,
.state-cell strong {
  display: block;
}

.state-cell span {
  color: var(--ink-faint);
  font-size: 0.74rem;
}

.state-cell strong {
  margin-top: 2px;
}

.state-cell.on {
  background: var(--success-soft);
  border-color: var(--success);
}

.state-cell.off {
  background: var(--surface-subtle);
}

.state-cell.fault {
  background: var(--safety-soft);
  border-color: var(--safety);
}

.reasoning-field {
  width: 100%;
  min-height: 112px;
  margin-top: 8px;
  padding: 12px 14px;
  color: var(--ink);
  background: var(--surface-raised);
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
}

.field-label {
  display: block;
  margin-top: 20px;
  font-weight: 700;
}

.kpi-stat {
  display: block;
  margin-bottom: 14px;
}

.kpi-stat strong {
  display: block;
  color: var(--primary);
  font-size: clamp(1.7rem, 3vw, 2.35rem);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.kpi-stat strong.kpi-accent {
  color: var(--success);
}

.kpi-stat .kpi-rule {
  display: block;
  height: 1px;
  margin: 8px 0 6px;
  background: var(--line);
}

.kpi-stat > span {
  display: block;
  color: var(--ink-faint);
  font-size: 0.78rem;
}

.mastery-card {
  min-height: 188px;
}

.mastery-card p {
  color: var(--ink-soft);
}

.evidence-list li {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}

.evidence-list li:last-child {
  border-bottom: 0;
}

.evidence-list span {
  color: var(--ink-faint);
  text-align: right;
}

.timeline {
  position: relative;
}

.timeline::before {
  position: absolute;
  top: 7px;
  bottom: 7px;
  left: 7px;
  width: 2px;
  background: var(--line);
  content: "";
}

.timeline li {
  position: relative;
  padding: 0 0 20px 30px;
}

.timeline li::before {
  position: absolute;
  top: 5px;
  left: 2px;
  width: 12px;
  height: 12px;
  background: var(--surface-raised);
  border: 3px solid var(--primary);
  border-radius: 50%;
  content: "";
}

.timeline li.safety-event::before {
  border-color: var(--safety);
}

.timeline time {
  display: block;
  color: var(--ink-faint);
  font-size: 0.75rem;
}

.table-wrap {
  max-width: 100%;
  overflow-x: auto;
  margin-top: 18px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

th,
td {
  padding: 12px 10px;
  text-align: left;
  vertical-align: top;
  border-bottom: 1px solid var(--line);
}

th {
  color: var(--ink-soft);
  font-size: 0.74rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.review-note {
  width: 100%;
  min-height: 110px;
  padding: 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  resize: vertical;
}

.curriculum-groups {
  display: grid;
  gap: 18px;
}

.topic-group h2 {
  margin-bottom: 16px;
}

.lesson-list {
  display: grid;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.lesson-row.is-locked .lesson-row-button {
  opacity: 0.6;
}

.lesson-row-button {
  display: flex;
  width: 100%;
  min-height: 56px;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 13px 16px;
  text-align: left;
  background: var(--surface-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color 160ms ease, background-color 160ms ease;
}

.lesson-row-button:not(:disabled):hover {
  border-color: var(--line-strong);
  background: var(--surface-subtle);
}

.lesson-row-button:disabled {
  cursor: not-allowed;
}

.lesson-row-title {
  font-weight: 700;
}

.empty-state {
  padding: 28px;
  text-align: center;
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-md);
}

.toast {
  position: fixed;
  z-index: 50;
  right: 24px;
  bottom: 24px;
  max-width: min(390px, calc(100vw - 32px));
  padding: 13px 16px;
  color: #fff;
  background: var(--nav);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-radius: var(--radius-md);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.22);
  opacity: 1;
  transform: translateY(0);
  transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out);
}

.toast.is-hiding {
  opacity: 0;
  transform: translateY(8px);
}

.mobile-nav {
  display: none;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

.noscript-message {
  margin: 20px;
  padding: 20px;
  color: var(--safety);
  background: var(--safety-soft);
  border: 2px solid var(--safety);
}

@media (hover: hover) and (pointer: fine) {
  .nav-item:not(:disabled):hover {
    color: #fff;
    background: rgba(255, 255, 255, 0.08);
  }

  .icon-button:hover,
  .quiet-button:hover {
    background: var(--topbar-hover);
  }
}

@media (max-width: 980px) {
  .app-layout {
    grid-template-columns: 196px minmax(0, 1fr);
  }

  .hero-grid,
  .lesson-grid,
  .review-grid {
    grid-template-columns: 1fr;
  }

  .dashboard-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .prototype-label {
    display: none;
  }
}

@media (max-width: 760px) {
  .topbar {
    min-height: 64px;
    padding: 10px 14px;
  }

  .brand small,
  .quiet-button {
    display: none;
  }

  .app-layout {
    display: block;
    min-height: calc(100vh - 64px);
  }

  .sidebar {
    display: none;
  }

  #app-main {
    padding: 28px 16px 100px;
  }

  .page-header {
    display: block;
  }

  .page-progress {
    width: 100%;
    margin-top: 20px;
  }

  .practice-grid,
  .dashboard-grid {
    grid-template-columns: 1fr;
  }

  .review-grid {
    min-width: 0;
  }

  .concept-strip {
    grid-template-columns: 1fr;
  }

  .concept-step {
    text-align: left;
  }

  .mobile-nav {
    display: grid;
    position: fixed;
    z-index: 30;
    right: 0;
    bottom: 0;
    left: 0;
    grid-template-columns: repeat(3, 1fr);
    padding: 6px 5px max(6px, env(safe-area-inset-bottom));
    background: rgba(16, 35, 55, 0.98);
    border-top: 1px solid rgba(255, 255, 255, 0.15);
  }

  .mobile-nav button {
    display: grid;
    min-height: 52px;
    place-items: center;
    gap: 1px;
    padding: 4px 2px;
    color: #c8d7e2;
    background: transparent;
    border: 0;
    border-radius: 8px;
    font-size: 0.66rem;
  }

  .mobile-nav button span {
    font-size: 1rem;
  }

  .mobile-nav button[aria-current="page"] {
    color: #fff;
    background: var(--nav-soft);
  }

  .mobile-nav button:disabled {
    opacity: 0.38;
  }

  .toast {
    right: 16px;
    bottom: 78px;
    left: 16px;
  }
}

@media (max-width: 460px) {
  .brand strong {
    max-width: 120px;
    font-size: 0.83rem;
  }

  .brand-mark {
    width: 36px;
    height: 36px;
  }

  .topbar-actions {
    gap: 5px;
  }

  .icon-button {
    min-width: 38px;
    min-height: 38px;
  }

  h1 {
    font-size: 2rem;
  }

  .panel {
    padding: 19px;
    border-radius: 14px;
  }

  .state-grid {
    grid-template-columns: 1fr;
  }

  .diagram-shell svg {
    min-height: 210px;
  }

  .button-row > * {
    width: 100%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
  }
}

html[data-reduced-motion="true"] *,
html[data-reduced-motion="true"] *::before,
html[data-reduced-motion="true"] *::after {
  scroll-behavior: auto !important;
  transition-duration: 0.01ms !important;
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
}

@media (forced-colors: active) {
  .progress-fill,
  .status-dot {
    background: CanvasText;
  }

  .diagram-line.active,
  .diagram-symbol.active {
    stroke: Highlight;
  }
}

  </style>

"use strict";

function circuitStateSvg(activeState) {
  const openState = activeState === "open";
  const closedState = activeState === "closed";
  const shortState = activeState === "short";
  return `
    <svg viewBox="0 0 640 260" role="img" aria-labelledby="cs-title cs-desc">
      <title id="cs-title">Circuit in the ${activeState} state</title>
      <desc id="cs-desc">A source, a switch, and a lamp connected in a loop, shown in the ${activeState} state.</desc>
      <path class="diagram-line active" d="M70 60 V200 H570 V60 Z" />
      <g class="diagram-symbol active">
        <line x1="70" y1="60" x2="70" y2="90" />
        <line x1="55" y1="90" x2="85" y2="90" />
        <line x1="61" y1="102" x2="79" y2="102" />
        <line x1="70" y1="102" x2="70" y2="200" />
      </g>
      <text class="diagram-text" x="90" y="88">SOURCE</text>
      <g class="diagram-symbol${closedState || shortState ? " active" : ""}">
        ${openState
          ? `<line x1="250" y1="60" x2="300" y2="35" />`
          : `<line x1="250" y1="60" x2="350" y2="60" />`}
        <circle cx="250" cy="60" r="5" fill="#42526a" />
        <circle cx="350" cy="60" r="5" fill="#42526a" />
      </g>
      <text class="diagram-text" x="265" y="30">SWITCH</text>
      ${shortState
        ? `<path class="diagram-line active" d="M420 60 V200" stroke="#a92720" />
           <text class="diagram-subtext" x="428" y="130" fill="#a92720">Short path around the lamp</text>`
        : ""}
      <g class="diagram-symbol${closedState ? " active" : ""}">
        <circle cx="470" cy="60" r="26" />
        <line x1="452" y1="42" x2="488" y2="78" />
        <line x1="452" y1="78" x2="488" y2="42" />
      </g>
      <text class="diagram-text" x="440" y="30">LAMP</text>
      <text class="diagram-subtext" x="30" y="230">
        ${openState ? "Open: the switch has broken the path. No current flows anywhere in the loop." : ""}
        ${closedState ? "Closed: one complete path. The same current flows through the source, switch, and lamp." : ""}
        ${shortState ? "Short: a low-resistance path bypasses the lamp. Current rises sharply and the lamp gets no useful current." : ""}
      </text>
    </svg>`;
}

function ohmsLawSvg() {
  return `
    <svg viewBox="0 0 640 240" role="img" aria-labelledby="ohm-title ohm-desc">
      <title id="ohm-title">Simple source-and-resistor loop</title>
      <desc id="ohm-desc">A source labeled V drives current I through a single resistor labeled R, returning to the source.</desc>
      <path class="diagram-line active" d="M80 60 V180 H560 V60 Z" />
      <g class="diagram-symbol active">
        <line x1="80" y1="60" x2="80" y2="90" />
        <line x1="65" y1="90" x2="95" y2="90" />
        <line x1="71" y1="102" x2="89" y2="102" />
        <line x1="80" y1="102" x2="80" y2="180" />
      </g>
      <text class="diagram-text" x="30" y="130">V</text>
      <text class="diagram-subtext" x="16" y="150">source</text>
      <g class="diagram-symbol active">
        <path d="M480 60 h16 l8 -16 l16 32 l16 -32 l16 32 l16 -32 l8 16 h16" />
      </g>
      <text class="diagram-text" x="475" y="35">R</text>
      <text class="diagram-subtext" x="455" y="20">resistor</text>
      <text class="diagram-text" x="290" y="45">I</text>
      <path class="diagram-line active" d="M270 60 l10 -6 l0 12 z" fill="#176b87" />
      <text class="diagram-subtext" x="230" y="205">Current I flows the same amount everywhere in this single loop.</text>
    </svg>`;
}

function seriesSvg() {
  return `
    <svg viewBox="0 0 680 220" role="img" aria-labelledby="series-title series-desc">
      <title id="series-title">Two resistors in series</title>
      <desc id="series-desc">A source connects to resistor R1, then resistor R2, in one single loop, then returns to the source.</desc>
      <path class="diagram-line active" d="M60 50 V170 H620 V50 Z" />
      <g class="diagram-symbol active">
        <line x1="60" y1="50" x2="60" y2="80" />
        <line x1="45" y1="80" x2="75" y2="80" />
        <line x1="51" y1="92" x2="69" y2="92" />
        <line x1="60" y1="92" x2="60" y2="170" />
      </g>
      <text class="diagram-subtext" x="14" y="115">source</text>
      <g class="diagram-symbol active">
        <path d="M220 50 h14 l7 -14 l14 28 l14 -28 l14 28 l14 -28 l7 14 h14" />
      </g>
      <text class="diagram-text" x="235" y="30">R1</text>
      <g class="diagram-symbol active">
        <path d="M420 50 h14 l7 -14 l14 28 l14 -28 l14 28 l14 -28 l7 14 h14" />

      <text class="diagram-text" x="435" y="30">R2</text>
      <text class="diagram-subtext" x="240" y="200">One path. The same current passes through R1 and then R2.</text>
    </svg>`;
}

function parallelSvg() {

      <path class="diagram-line active" d="M140 60 H540 M140 200 H540" />
      <path class="diagram-line active" d="M540 60 V200" />
      <path class="diagram-line active" d="M540 130 H620" />
      <g class="diagram-symbol active">
        <line x1="60" y1="130" x2="60" y2="100" />
        <line x1="45" y1="100" x2="75" y2="100" />
        <line x1="51" y1="88" x2="69" y2="88" />
        <line x1="60" y1="88" x2="60" y2="60" />

function flattenLessons() {
  const all = [];
  topics.forEach(topic => {
    topic.lessons.forEach(lesson => all.push({ ...lesson, topicId: topic.id, topicTitle: topic.title }));
  });
  return all;
}

const allLessons = flattenLessons();

function getLesson(id) {
  return allLessons.find(lesson => lesson.id === id) || null;
}

function getNextLessonId(currentId) {
  const index = allLessons.findIndex(lesson => lesson.id === currentId);
  if (index === -1 || index === allLessons.length - 1) return null;
  return allLessons[index + 1].id;
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify(state.progress));
  } catch {
    /* storage unavailable; progress stays in-memory for this session */
  }
}

function escapeCsv(value) {
  const safe = String(value ?? "").replace(/^([=+\-@])/, "'$1");
  return `"${safe.replaceAll('"', '""')}"`;
}

function lessonEntry(id) {
  return state.progress[id] || { status: "not-started", attempts: 0, wrongStreak: 0, independentAt: null };
}

function lessonStatus(id) {
  return lessonEntry(id).status;
}

function prereqsMet(lesson) {
  return lesson.prereqs.every(id => ["developing", "independent"].includes(lessonStatus(id)));
}

function isReviewDue(id) {
  const entry = lessonEntry(id);
  return entry.status === "independent" && entry.independentAt && (Date.now() - entry.independentAt) > REVIEW_DUE_MS;
}

function recordSimpleResult(lessonId, correct) {
  const entry = { ...lessonEntry(lessonId) };
  entry.attempts += 1;
  if (correct) {
    entry.status = entry.wrongStreak > 0 ? "developing" : "independent";
    entry.independentAt = entry.wrongStreak > 0 ? null : Date.now();
    entry.wrongStreak = 0;
  } else {
    entry.wrongStreak += 1;
    entry.status = entry.wrongStreak >= 2 ? "stuck" : "introduced";
  }
  state.progress[lessonId] = entry;
  saveProgress();
  return entry;
}

function markLessonStatus(lessonId, status) {
  const entry = { ...lessonEntry(lessonId), status };
  if (status === "independent") entry.independentAt = Date.now();
  state.progress[lessonId] = entry;
  saveProgress();
}

function statusLabel(status) {
  return {
    "not-started": "Not started",
    "introduced": "Introduced",
    "developing": "Developing",
    "independent": "Independently demonstrated",
    "stuck": "Needs a prerequisite review"
  }[status] || "Not started";
}

function statusClass(status) {
  return {
    "not-started": "neutral-label",
    "introduced": "neutral-label",
    "developing": "caution-label",
    "independent": "verified-label",
    "stuck": "safety-label"
  }[status] || "neutral-label";
}

function progressHeader(eyebrow, title, description, step, total) {
  const ratio = Math.max(0, Math.min(1, step / total));
  return `
    <header class="page-header">

        <p class="eyebrow">${eyebrow}</p>
        <h1>${title}</h1>
        <p class="lede">${description}</p>

          <div class="progress-fill" style="--progress:${ratio}"></div>
        </div>

    </header>`;
}

          <button class="button-secondary" type="button" data-route="curriculum">Browse all topics instead</button>
          <button class="button-quiet" type="button" data-action="restart-diagnostic">Retake placement check</button>
        </div>
      </section>`;
  }

  const question = diagnosticQuestions[state.diagnosticIndex];
  return `
    ${progressHeader("Placement check", "Show what you already know.", "Choose the best answer. “I don't know yet” is useful information and is never treated as a failure.", 2, 4)}
    <section class="panel question-card">
      <p class="question-number">Question ${state.diagnosticIndex + 1} of ${diagnosticQuestions.length}</p>
      <fieldset>
        <legend>${question.prompt}</legend>
        <div class="choice-list">
          ${question.options.map(option => `
            <button class="choice-button" type="button" data-action="diagnostic-choice" data-option="${option.id}" aria-pressed="${state.diagnosticSelection === option.id}">${option.label}</button>`).join("")}
        </div>
      </fieldset>
      <div class="button-row">
        <button class="button" type="button" data-action="diagnostic-next" ${state.diagnosticSelection ? "" : "disabled"}>${state.diagnosticIndex === diagnosticQuestions.length - 1 ? "Complete placement check" : "Continue"}</button>
        <button class="button-quiet" type="button" data-route="welcome">Back</button>
      </div>
    </section>`;
}

function renderCurriculum() {
  const groups = topics.map(topic => {
    const rows = topic.lessons.map(lesson => {
      const entry = lessonEntry(lesson.id);
      const locked = !prereqsMet(lesson);
      const reviewDue = isReviewDue(lesson.id);
      return `
        <li class="lesson-row${locked ? " is-locked" : ""}">
          <button class="lesson-row-button" type="button" data-action="open-lesson" data-lesson-id="${lesson.id}" ${locked || !state.safetyAcknowledged ? "disabled" : ""}>
            <span class="lesson-row-title">${lesson.title}</span>
            <span class="${statusClass(entry.status)}">${locked ? "Locked" : statusLabel(entry.status)}${reviewDue ? " · Review due" : ""}</span>
          </button>
          ${locked ? `<p class="microcopy">Unlocks after: ${lesson.prereqs.map(id => getLesson(id).title).join(", ")}</p>` : ""}
        </li>`;
    }).join("");
    return `
      <section class="panel panel-flat topic-group" aria-labelledby="topic-${topic.id}">
        <h2 id="topic-${topic.id}">${topic.title}</h2>
        <ul class="lesson-list">${rows}</ul>
      </section>`;
  }).join("");

  return `
    ${progressHeader("Curriculum", "Every topic, in order.", "Topics unlock as you build the prerequisite ideas underneath them. Nothing here is timed: go as deep as you want.", 3, 4)}
    ${!state.safetyAcknowledged ? `<div class="feedback caution"><strong>Acknowledge the course boundary first</strong><p>Return to the welcome screen and check the acknowledgment box to unlock lessons.</p></div>` : ""}
    <div class="curriculum-groups">${groups}</div>`;
}

function renderLesson() {
  const lesson = getLesson(state.currentLessonId);
  if (!lesson) return renderCurriculum();
  if (lesson.kind === "custom") return renderMotorStarterLesson(lesson);
  return renderSimpleLesson(lesson);
}

function renderSimpleLesson(lesson) {
  const entry = lessonEntry(lesson.id);

  if (state.lessonStep === "intro") {
    const diagramHtml = lesson.diagram
      ? `<div class="diagram-shell">
           <div class="diagram-toolbar"><strong>Diagram</strong><span>SVG and text alternative</span></div>
           ${lesson.diagram(state.circuitStateView)}
         </div>
         ${lesson.diagramStates ? `
         <div class="trace-controls" role="group" aria-label="Diagram state selector">
           ${lesson.diagramStates.map(s => `<button class="trace-button" type="button" data-action="circuit-state-view" data-state="${s}" aria-pressed="${state.circuitStateView === s}">${s[0].toUpperCase() + s.slice(1)}</button>`).join("")}
         </div>` : ""}`
      : "";
    return `
      ${progressHeader(lesson.topicTitle, lesson.title, lesson.hook, 1, 3)}
      <div class="learning-target">
        <span class="target-icon" aria-hidden="true">T</span>
        <div><strong>Learning target</strong><span>${lesson.target}</span></div>
      </div>
      <div class="lesson-grid">
        <section class="panel" aria-labelledby="explain-title">
          <span class="neutral-label">Explanation</span>
          <h2 id="explain-title">In plain language</h2>
          <p>${lesson.explainPlain}</p>
          <h3>In more technical terms</h3>
          <p>${lesson.explainTechnical}</p>
          ${diagramHtml}
        </section>
        <section class="panel panel-flat">
          <span class="caution-label">Why it matters</span>
          <h2>On the shop floor</h2>
          <p>${lesson.workplace}</p>
          <div class="button-row">
            <button class="button" type="button" data-action="lesson-to-practice">Try the practice question</button>
            <button class="button-quiet" type="button" data-route="curriculum">Back to curriculum</button>
          </div>
        </section>
      </div>`;
  }

  if (state.lessonStep === "practice") {
    const p = lesson.practice;
    return `
      ${progressHeader(lesson.topicTitle, lesson.title, "Ungraded practice: try it out, no pressure.", 2, 3)}
      <section class="panel question-card">
        <span class="neutral-label">Practice (ungraded)</span>
        <fieldset ${state.practiceChecked ? "disabled" : ""}>
          <legend>${p.prompt}</legend>
          <div class="choice-list">
            ${p.options.map(option => `<button class="choice-button" type="button" data-action="practice-choice" data-option="${option.id}" aria-pressed="${state.practiceSelection === option.id}" ${state.practiceChecked ? "disabled" : ""}>${option.label}</button>`).join("")}
          </div>
        </fieldset>
        ${state.practiceChecked ? `<div class="feedback ${p.options.find(o => o.id === state.practiceSelection)?.correct ? "success" : "caution"}" role="status"><p>${p.options.find(o => o.id === state.practiceSelection)?.correct ? p.feedbackCorrect : p.feedbackIncorrect}</p></div>` : ""}
        <div class="button-row">
          ${state.practiceChecked
            ? `<button class="button" type="button" data-action="lesson-to-assessment">Continue to the graded check</button>`
            : `<button class="button" type="button" data-action="practice-check" ${state.practiceSelection ? "" : "disabled"}>Check my answer</button>`}
          <button class="button-quiet" type="button" data-action="lesson-to-intro">Review the explanation</button>
        </div>
      </section>`;
  }

  if (state.lessonStep === "assessment") {
    if (entry.status === "stuck") {
      const prereqId = lesson.prereqs[lesson.prereqs.length - 1];
      const prereq = prereqId ? getLesson(prereqId) : null;
      return `

        <section class="panel question-card">
          <span class="caution-label">Prerequisite recovery</span>
          <h2>This depends on an earlier idea</h2>

            <button class="button-secondary" type="button" data-action="retry-assessment-fresh">Try this check again now</button>
            <button class="button-quiet" type="button" data-action="lesson-to-intro">Reread this lesson</button>

    return `

        <fieldset ${state.assessmentResult ? "disabled" : ""}>
          <legend>${variant.prompt}</legend>
          <div class="choice-list">
            ${variant.options.map(option => `<button class="choice-button" type="button" data-action="assessment-choice" data-option="${option.id}" aria-pressed="${state.assessmentSelection === option.id}" ${state.assessmentResult ? "disabled" : ""}>${option.label}</button>`).join("")}
          </div>
        </fieldset>
        ${state.assessmentResult ? `<div class="feedback ${state.assessmentResult.correct ? "success" : "caution"}" role="status"><p>${state.assessmentResult.correct ? "Correct." : state.assessmentResult.misconception}</p></div>` : ""}
        <div class="button-row">
          ${state.assessmentResult
            ? state.assessmentResult.correct
              ? `<button class="button" type="button" data-action="lesson-complete">Continue</button>`
              : (entry.status === "stuck"
                ? `<button class="button" type="button" data-action="lesson-refresh">See the prerequisite review</button>`
                : `<button class="button" type="button" data-action="retry-assessment-variant">Try a similar question</button>`)
            : `<button class="button" type="button" data-action="submit-assessment" ${state.assessmentSelection ? "" : "disabled"}>Check my answer</button>`}
          <button class="button-quiet" type="button" data-action="lesson-to-intro">Review the explanation</button>
        </div>
      </section>`;
  }

  return "";
}

function renderMotorStarterLesson(lesson) {
  const ms = state.motorStarter;
  const steps = [
    { title: "L1 control source", body: "The trace begins at the identified control-power source. Never assume the voltage; use the approved drawing and equipment information." },
    { title: "Stop contact", body: "A normally closed stop contact passes control current in its normal, unoperated state. Operating STOP opens the path." },
    { title: "Start and seal-in paths", body: "The normally open START contact provides the initial path. The M auxiliary contact provides a parallel holding path after START is released." },
    { title: "M contactor coil", body: "When the complete control path is healthy, the M coil energizes and changes its associated contacts." },
    { title: "Return to L2", body: "A complete circuit requires a return path. Trace the entire rung instead of stopping at the first device that looks suspicious." }
  ];
  const traceOptionsOne = [
    { index: 3, label: "M contactor coil" },
    { index: 0, label: "L1 control source" },
    { index: 4, label: "L2 return" },
    { index: 2, label: "START or M auxiliary path" },
    { index: 1, label: "Normally closed STOP contact" }
  ];
  const traceOptionsTwo = [
    { index: 2, label: "Program logic and permissives" },
    { index: 4, label: "M1 contactor" },
    { index: 0, label: "Part-present sensor" },
    { index: 3, label: "PLC output O:0/1" },
    { index: 1, label: "PLC input I:0/3" }
  ];

  if (ms.lessonStep < 6) {
    const selected = steps[Math.min(ms.lessonStep, steps.length - 1)];
    return `
      ${progressHeader(lesson.topicTitle, lesson.title, "Trace a motor starter control circuit from source to coil, then follow the input/output signal chain that commands it.", 1, 3)}
      <div class="learning-target">
        <span class="target-icon" aria-hidden="true">T</span>
        <div><strong>Learning target</strong><span>Given a basic three-wire starter drawing, trace the normal control path and explain why the coil remains energized after START is released.</span></div>
      </div>
      <div class="lesson-grid">
        <section class="panel" aria-labelledby="concept-title">
          <span class="neutral-label">Guided explanation</span>
          <h2 id="concept-title">Read the rung from source to return</h2>
          <div class="concept-strip" role="group" aria-label="Control-circuit concept steps">
            ${steps.map((step, index) => `<button class="concept-step ${ms.lessonStep === index ? "active" : ""}" type="button" data-action="ms-lesson-step" data-index="${index}" aria-pressed="${ms.lessonStep === index}">${index + 1}. ${step.title}</button>`).join("")}
          </div>
          <div class="feedback"><strong>${selected.title}</strong><p>${selected.body}</p></div>
          <div class="diagram-shell">
            <div class="diagram-toolbar"><strong>Diagram A · Three-wire starter</strong><span>SVG and text alternative</span></div>
            ${ladderSvg(ms.lessonStep)}
          </div>
          <details>
            <summary>Read the complete diagram description</summary>
            <p>The rung begins at L1. It passes through the normally closed STOP contact. It then divides into two parallel paths: the normally open START contact and the normally open M auxiliary seal-in contact. The paths rejoin before the M contactor coil, and the circuit returns to L2.</p>
          </details>
        </section>

        <section class="panel panel-flat" aria-labelledby="trace-title">
          <span class="caution-label">Observe and reason only</span>
          <h2 id="trace-title">Build the trace</h2>
          <p>Select the next element in the correct electrical reading order.</p>
          <div class="trace-controls">
            ${traceOptionsOne.map(option => `<button class="trace-button" type="button" data-action="ms-trace-one" data-index="${option.index}" aria-pressed="${option.index <= ms.diagramOneStep}"><span class="trace-index">${option.index + 1}</span>${option.label}</button>`).join("")}
          </div>
          ${ms.diagramOneFeedback ? `<div class="feedback ${ms.diagramOneFeedback.startsWith("Correct") || ms.diagramOneFeedback.startsWith("Trace") ? "success" : "caution"}" role="status"><p>${ms.diagramOneFeedback}</p></div>` : ""}
          <div class="button-row">
            <button class="button-quiet" type="button" data-action="ms-reset-trace-one">Reset trace</button>
            <button class="button" type="button" data-action="ms-to-signal-chain" ${ms.diagramOneStep === 4 ? "" : "disabled"}>Continue to signal chain</button>
          </div>
        </section>
      </div>`;
  }

  if (ms.lessonStep === 6) {
    return `
      ${progressHeader(lesson.topicTitle, "Follow the signal, then isolate the difference.", "Use observable states to narrow the fault. Do not bypass a safeguard, force an output, change parameters, or open energized equipment: even in this simulation.", 2, 3)}
      <div class="practice-grid">
        <section class="panel" aria-labelledby="signal-title">
          <span class="neutral-label">Interactive diagram B</span>
          <h2 id="signal-title">Input-to-output signal chain</h2>
          <p>Build the information path from the physical sensor to the motor contactor.</p>
          <div class="diagram-shell">
            <div class="diagram-toolbar"><strong>Diagram B · Control signal path</strong><span>Not a live PLC view</span></div>
            ${ioSvg(ms.diagramTwoStep)}
          </div>
          <div class="trace-controls">
            ${traceOptionsTwo.map(option => `<button class="trace-button" type="button" data-action="ms-trace-two" data-index="${option.index}" aria-pressed="${option.index <= ms.diagramTwoStep}"><span class="trace-index">${option.index + 1}</span>${option.label}</button>`).join("")}
          </div>
          ${ms.diagramTwoFeedback ? `<div class="feedback ${ms.diagramTwoFeedback.startsWith("Correct") || ms.diagramTwoFeedback.startsWith("Signal") ? "success" : "caution"}" role="status"><p>${ms.diagramTwoFeedback}</p></div>` : ""}
        </section>

        <section class="panel" aria-labelledby="sim-title">
          <span class="caution-label">Safe reasoning simulation</span>
          <h2 id="sim-title">Conveyor will not start</h2>
          <p>Operator report: the conveyor is stopped. The HMI shows no active drive fault. Choose the next safe information-gathering step.</p>
          ${renderSimulationBody(ms)}
        </section>
      </div>
      <div class="button-row">
        <button class="button-quiet" type="button" data-action="ms-lesson-step-jump" data-index="0">Review the lesson</button>
        <button class="button" type="button" data-action="ms-to-assessment" ${ms.simulationComplete && ms.diagramTwoStep === 4 ? "" : "disabled"}>Continue to assessment</button>
      </div>`;
  }

  if (ms.lessonStep === 7) {
    if (ms.assessmentFeedback === "remediation") return renderRemediation(lesson, ms);
    return `
      ${progressHeader(lesson.topicTitle, "Explain why the starter drops out.", "Answer without hints. The result records knowledge and reasoning evidence.", 3, 3)}
      <section class="panel question-card">
        <span class="neutral-label">Misconception-based assessment</span>
        <fieldset ${ms.assessmentPassed ? "disabled" : ""}>
          <legend>A motor contactor energizes while the START pushbutton is held, but drops out as soon as START is released. What is the most likely control-circuit problem?</legend>
          <div class="choice-list">
            ${[
              ["seal", "The auxiliary seal-in contact or its parallel wiring path is not completing"],
              ["bearing", "The motor bearings are creating too much friction"],
              ["stop", "The normally closed STOP contact must be open"],
              ["unknown", "I don't know yet"]
            ].map(([id, label]) => `<button class="choice-button" type="button" data-action="ms-assessment-choice" data-option="${id}" aria-pressed="${ms.assessmentSelection === id}" ${ms.assessmentPassed ? "disabled" : ""}>${label}</button>`).join("")}
          </div>
          <label class="field-label" for="reasoning">Explain the evidence in your own words.</label>
          <textarea class="reasoning-field" id="reasoning" placeholder="For example: describe what holding START proves and what changes when it is released." ${ms.assessmentPassed ? "disabled" : ""}></textarea>
        </fieldset>
        ${ms.assessmentFeedback && ms.assessmentFeedback !== "remediation" ? `<div class="feedback ${ms.assessmentPassed ? "success" : "caution"}" role="status"><p>${ms.assessmentFeedback}</p></div>` : ""}
        <div class="button-row">
          ${ms.assessmentPassed ? `<button class="button" type="button" data-action="ms-finish">Finish this lesson</button>` : `<button class="button" type="button" data-action="ms-submit-assessment" ${ms.assessmentSelection ? "" : "disabled"}>Check my reasoning</button>`}
          <button class="button-quiet" type="button" data-action="ms-lesson-step-jump" data-index="0">Review the diagram</button>
        </div>
      </section>`;
  }

  return `
    ${progressHeader(lesson.topicTitle, "Lesson complete.", "Nice work: this was the most involved lesson in the course so far.", 3, 3)}
    <section class="panel">
      <span class="verified-label">${statusLabel(lessonStatus(lesson.id))}</span>
      <h2>Motor Starter Control Circuits</h2>
      <p>This lesson combined a ladder-diagram trace, a signal-chain trace, a safe troubleshooting simulation, and a graded assessment with remediation.</p>
      <div class="button-row">
        <button class="button" type="button" data-route="curriculum">Back to curriculum</button>
        <button class="button-secondary" type="button" data-route="progress">View my progress</button>
      </div>
    </section>`;
}

function renderSimulationBody(ms) {
  if (ms.simulationHold) {
    return `
      <div class="feedback error" role="alert">
        <strong>Simulation stopped: unsafe action</strong>
        <p>Bypassing a protective device, forcing an output, changing unexplained parameters, or accessing energized equipment exceeds this activity's scope, even in a simulation. Preserve the machine state and follow the approved escalation process.</p>
      </div>
      <button class="button" type="button" data-action="ms-clear-simulation-hold">Review boundary and restart</button>`;
  }

  if (ms.simulationComplete) {
    return `
      <div class="state-grid" aria-label="Final observed simulation state">
        <div class="state-cell on"><span>Guard permissive</span><strong>ON · healthy</strong></div>
        <div class="state-cell on"><span>Start request</span><strong>ON · received</strong></div>
        <div class="state-cell fault"><span>Sensor field indication</span><strong>ON at sensor</strong></div>
        <div class="state-cell off"><span>PLC input I:0/3</span><strong>OFF · unexpected</strong></div>
      </div>
      <div class="feedback success"><strong>Fault region isolated</strong><p>The expected sensor indication does not agree with the PLC input state. The safe conclusion is to escalate for approved inspection of the sensor signal path, not to force the output or bypass the input.</p></div>
      <button class="button-quiet" type="button" data-action="ms-restart-simulation">Run the scenario again</button>`;
  }

  if (ms.simulationStep === 0) {
    return `
      <div class="choice-list">
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="observe">Review HMI permissives and approved external indicators</button>
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="open-live">Open the energized control panel and begin probing</button>
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="bypass">Bypass the guard switch to test the start circuit</button>
      </div>`;
  }

  if (ms.simulationStep === 1) {
    return `
      <div class="state-grid" aria-label="Observed simulation states">
        <div class="state-cell on"><span>Emergency stop chain</span><strong>Healthy</strong></div>
        <div class="state-cell on"><span>Guard permissive</span><strong>ON</strong></div>
        <div class="state-cell on"><span>Start request</span><strong>ON</strong></div>
        <div class="state-cell off"><span>PLC output O:0/1</span><strong>OFF</strong></div>
      </div>
      <p><strong>What information best narrows the fault next?</strong></p>
      <div class="choice-list">
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="compare-input">Compare the sensor's approved indication with PLC input I:0/3</button>
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="force-output">Force PLC output O:0/1 on</button>
        <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="change-drive">Change drive parameters until the conveyor moves</button>
      </div>`;
  }

  return `
    <div class="state-grid" aria-label="Compared sensor and PLC states">
      <div class="state-cell on"><span>Sensor field indication</span><strong>ON</strong></div>
      <div class="state-cell fault"><span>PLC input I:0/3</span><strong>OFF · unexpected</strong></div>
      <div class="state-cell on"><span>Guard permissive</span><strong>ON</strong></div>
      <div class="state-cell off"><span>PLC output O:0/1</span><strong>OFF · expected with missing input</strong></div>
    </div>
    <p><strong>What is the defensible next conclusion?</strong></p>
    <div class="choice-list">
      <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="signal-path">The fault region is between the sensor indication and PLC input; escalate for an approved signal-path inspection</button>
      <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="jumper">Jumper the sensor input so the PLC sees the condition</button>
      <button class="choice-button" type="button" data-action="ms-simulation-choice" data-option="motor">Replace the motor because the conveyor did not move</button>
    </div>`;
}

function renderRemediation(lesson, ms) {
  return `
    ${progressHeader(lesson.topicTitle, "Rebuild the seal-in idea.", "Your response suggests the distinction between the STOP path and the auxiliary holding path needs another example.", 3, 3)}
    <div class="lesson-grid">
      <section class="panel">
        <span class="caution-label">Targeted prerequisite recovery</span>
        <h2>What the symptom already proves</h2>
        <p>If the coil stays energized while START is held, the source, STOP contact, START contact, coil, and return path can complete a circuit at that moment.</p>
        <p>When START is released, its contact opens. The M auxiliary contact must provide the parallel path that keeps the coil energized. If that path does not complete, the coil drops out.</p>
        <div class="diagram-shell">
          <div class="diagram-toolbar"><strong>Worked example · Holding path</strong><span>Auxiliary path highlighted</span></div>
          ${ladderSvg(3)}
        </div>
        <details open>
          <summary>Reasoning pattern</summary>
          <p><strong>Symptom:</strong> Coil works only while START is held. <strong>Known:</strong> The initial path can energize the coil. <strong>Change:</strong> Releasing START removes that path. <strong>Likely region:</strong> The parallel auxiliary seal-in path.</p>
        </details>
      </section>
      <section class="panel panel-flat">
        <span class="neutral-label">Equivalent check</span>
        <h2>Try the idea in a new wording</h2>
        <fieldset>
          <legend>A relay should remain on after a momentary ON button is released. Which element normally provides that continuing path?</legend>
          <div class="choice-list">
            ${[
              ["aux", "A normally open auxiliary contact controlled by the relay"],
              ["fuse", "A larger control fuse"],
              ["overload", "The motor overload heaters"],
              ["unknown", "I don't know yet"]
            ].map(([id, label]) => `<button class="choice-button" type="button" data-action="ms-remediation-choice" data-option="${id}" aria-pressed="${ms.remediationSelection === id}">${label}</button>`).join("")}
          </div>
        </fieldset>
        ${ms.remediationFeedback ? `<div class="feedback ${ms.remediationComplete ? "success" : "caution"}" role="status"><p>${ms.remediationFeedback}</p></div>` : ""}
        <div class="button-row">
          ${ms.remediationComplete ? `<button class="button" type="button" data-action="ms-finish">View updated progress</button>` : `<button class="button" type="button" data-action="ms-submit-remediation" ${ms.remediationSelection ? "" : "disabled"}>Check answer</button>`}
        </div>
      </section>
    </div>`;
}

function renderProgress() {
  const rows = [];
  topics.forEach(topic => {
    topic.lessons.forEach(lesson => {
      const entry = lessonEntry(lesson.id);
      rows.push({ topic: topic.title, lesson: lesson.title, id: lesson.id, entry });
    });
  });
  const startedCount = rows.filter(r => r.entry.status !== "not-started").length;
  const independentCount = rows.filter(r => r.entry.status === "independent").length;

  return `
    ${progressHeader("Progress", "Your evidence, not just a completion percentage.", "Each status explains what was observed, not a single hidden score.", 4, 4)}
    <div class="dashboard-grid">
      <section class="panel mastery-card">
        <div class="kpi-stat">
          <strong class="kpi-accent">${independentCount} <span style="font-size:0.5em;font-weight:700;">/ ${rows.length}</span></strong>
          <span class="kpi-rule"></span>
          <span>Independently demonstrated</span>
        </div>
        <p>Lessons where you answered a graded check correctly on the first try.</p>
      </section>
      <section class="panel mastery-card">
        <div class="kpi-stat">
          <strong>${startedCount} <span style="font-size:0.5em;font-weight:700;">/ ${rows.length}</span></strong>
          <span class="kpi-rule"></span>
          <span>Lessons started</span>
        </div>
        <p>Includes lessons still in progress or needing a prerequisite review.</p>
      </section>
      <section class="panel mastery-card">
        <span class="neutral-label">Export</span>
        <h2>Keep a personal copy</h2>
        <p>Download your current progress as a spreadsheet-compatible file for your own records.</p>
        <button class="button-secondary" type="button" data-action="export-progress">Export my progress (CSV)</button>
      </section>
    </div>
    <section class="panel panel-flat" style="margin-top:22px">
      <h2>Evidence by lesson</h2>
      <ul class="evidence-list">
        ${rows.map(r => `<li><strong>${r.topic} · ${r.lesson}</strong><span class="${statusClass(r.entry.status)}">${statusLabel(r.entry.status)}${isReviewDue(r.id) ? " · Review due" : ""}</span></li>`).join("")}
      </ul>
    </section>`;
}

const renderers = {
  welcome: renderWelcome,
  diagnostic: renderDiagnostic,
  curriculum: renderCurriculum,
  lesson: renderLesson,
  progress: renderProgress
};

function setRoute(route, focusMain = true) {
  if (!renderers[route]) route = "welcome";
  if ((route === "diagnostic" || route === "lesson") && !state.safetyAcknowledged) {
    route = "welcome";
    showToast("Acknowledge the course boundary before starting a lesson.");
  }
  state.route = route;
  history.replaceState(null, "", `#${route}`);
  render();
  if (focusMain) main.focus({ preventScroll: true });
  window.scrollTo({ top: 0, behavior: "auto" });
}

function openLesson(lessonId) {
  const lesson = getLesson(lessonId);
  if (!lesson) return;
  if (!prereqsMet(lesson)) {
    showToast("Complete the prerequisite lesson first.");
    return;
  }
  state.currentLessonId = lessonId;
  state.lessonStep = "intro";
  state.practiceSelection = null;
  state.practiceChecked = false;
  state.assessmentSelection = null;
  state.assessmentVariant = 0;
  state.assessmentResult = null;
  state.circuitStateView = "closed";
  if (lesson.kind === "custom") {
    state.motorStarter = {
      lessonStep: 0, diagramOneStep: -1, diagramOneFeedback: "",
      diagramTwoStep: -1, diagramTwoFeedback: "", simulationStep: 0,
      simulationHold: false, simulationFeedback: "", simulationComplete: false,
      assessmentSelection: null, assessmentFeedback: "", assessmentPassed: false,
      remediationSelection: null, remediationFeedback: "", remediationComplete: false
    };
  }
  if (lessonStatus(lessonId) === "not-started") markLessonStatus(lessonId, "introduced");
  setRoute("lesson");
}

function render() {
  main.innerHTML = renderers[state.route]();
  document.querySelectorAll("[data-route]").forEach(button => {
    button.toggleAttribute("aria-current", button.dataset.route === state.route);
  });
  announcer.textContent = `${state.route.replace("-", " ")} screen loaded`;
}

function showToast(message) {
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.hidden = false;
  toast.classList.remove("is-hiding");
  toastTimer = setTimeout(() => {
    toast.classList.add("is-hiding");
    setTimeout(() => {
      toast.hidden = true;
      toast.classList.remove("is-hiding");
    }, 190);
  }, 3200);
}

function handleDiagnosticNext() {
  const question = diagnosticQuestions[state.diagnosticIndex];
  const answer = question.options.find(option => option.id === state.diagnosticSelection);
  state.diagnosticAnswers[state.diagnosticIndex] = answer;
  state.diagnosticSelection = null;
  if (state.diagnosticIndex < diagnosticQuestions.length - 1) {
    state.diagnosticIndex += 1;
  } else {
    state.diagnosticComplete = true;
  }
  render();
  main.focus();
}

function handleMsTrace(which, index) {
  const ms = state.motorStarter;
  const stepKey = which === "one" ? "diagramOneStep" : "diagramTwoStep";
  const feedbackKey = which === "one" ? "diagramOneFeedback" : "diagramTwoFeedback";
  const next = ms[stepKey] + 1;
  if (index === next) {
    ms[stepKey] = index;
    ms[feedbackKey] = index === 4
      ? (which === "one" ? "Trace complete. You followed the control path from source to return." : "Signal chain complete. You followed information from the field device to the controlled output.")
      : "Correct. Now select the next element in the path.";
  } else if (index <= ms[stepKey]) {
    ms[feedbackKey] = "That element is already confirmed. Continue from the last highlighted point.";
  } else {
    ms[feedbackKey] = "Not yet. Trace one connection at a time from the current confirmed element.";
  }
  render();
}

function handleMsSimulation(option) {
  const ms = state.motorStarter;
  const unsafe = ["open-live", "bypass", "force-output", "change-drive", "jumper"].includes(option);
  if (unsafe) {
    ms.simulationHold = true;
    ms.simulationFeedback = "unsafe";
    render();
    return;
  }
  if (ms.simulationStep === 0 && option === "observe") {
    ms.simulationStep = 1;
  } else if (ms.simulationStep === 1 && option === "compare-input") {
    ms.simulationStep = 2;
  } else if (ms.simulationStep === 2 && option === "signal-path") {
    ms.simulationComplete = true;
    showToast("Signal chain isolated. Assessment check is next.");
  } else {
    ms.simulationFeedback = "ordinary-error";
    showToast("That conclusion does not match the observed states. Compare expected and observed information again.");
  }
  render();
}

function submitMsAssessment() {
  const ms = state.motorStarter;
  const reasoning = document.getElementById("reasoning")?.value.trim() ?? "";
  if (ms.assessmentSelection === "seal") {
    if (reasoning.length < 20) {
      ms.assessmentFeedback = "Your selection is defensible. Add a short explanation of what holding START proves and what changes when START is released.";
    } else {
      ms.assessmentPassed = true;
      ms.assessmentFeedback = "Correct. You connected the symptom to the missing auxiliary holding path.";
      markLessonStatus(state.currentLessonId, "independent");
      showToast("Independent evidence recorded for this lesson.");
    }
  } else {
    ms.assessmentFeedback = "remediation";
    markLessonStatus(state.currentLessonId, "developing");
  }
  render();
}

function submitMsRemediation() {
  const ms = state.motorStarter;
  if (ms.remediationSelection === "aux") {
    ms.remediationComplete = true;
    ms.remediationFeedback = "Correct. You applied the holding-path idea to an equivalent example. Because instruction was provided first, this stays Developing until an independent retry.";
  } else {
    ms.remediationFeedback = "Not yet. Identify what must create a second path around the momentary ON button after it opens.";
  }
  render();
}

function exportProgress() {
  const rows = [["Topic", "Lesson", "Status", "Attempts", "Independent since"]];
  topics.forEach(topic => {
    topic.lessons.forEach(lesson => {
      const entry = lessonEntry(lesson.id);
      rows.push([
        topic.title,
        lesson.title,
        statusLabel(entry.status),
        String(entry.attempts || 0),
        entry.independentAt ? new Date(entry.independentAt).toISOString().slice(0, 10) : ""
      ]);
    });
  });
  const csv = rows.map(row => row.map(escapeCsv).join(",")).join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "my-electrical-academy-progress.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
  showToast("Progress exported.");
}

document.addEventListener("pointerdown", () => {
  document.body.dataset.modality = "pointer";
}, true);

document.addEventListener("keydown", () => {
  document.body.dataset.modality = "keyboard";
}, true);

document.addEventListener("change", event => {
  if (event.target.id === "safety-ack") {
    state.safetyAcknowledged = event.target.checked;
    render();
    if (state.safetyAcknowledged) showToast("Course boundary acknowledged for this session.");
  }
});

document.addEventListener("click", event => {
  const routeTarget = event.target.closest("[data-route]");
  if (routeTarget && !routeTarget.disabled) {
    if (routeTarget.tagName === "A") event.preventDefault();
    setRoute(routeTarget.dataset.route);
    return;
  }

  const actionTarget = event.target.closest("[data-action]");
  if (!actionTarget || actionTarget.disabled) return;
  const { action, option, index, lessonId, state: stateName } = actionTarget.dataset;
  const lesson = () => getLesson(state.currentLessonId);

  switch (action) {
    case "begin-diagnostic":
      setRoute("diagnostic");
      break;
    case "diagnostic-choice":
      state.diagnosticSelection = option;
      render();
      break;
    case "diagnostic-next":
      handleDiagnosticNext();
      break;
    case "restart-diagnostic":
      state.diagnosticIndex = 0;
      state.diagnosticAnswers = [];
      state.diagnosticSelection = null;
      state.diagnosticComplete = false;
      render();
      break;
    case "open-lesson":
      openLesson(lessonId);
      break;
    case "lesson-to-intro":
      state.lessonStep = "intro";
      render();
      break;
    case "lesson-to-practice":
      state.lessonStep = "practice";
      state.practiceSelection = null;
      state.practiceChecked = false;
      render();
      break;
    case "practice-choice":
      state.practiceSelection = option;
      render();
      break;
    case "practice-check":
      state.practiceChecked = true;
      render();
      break;
    case "lesson-to-assessment":
      state.lessonStep = "assessment";
      state.assessmentSelection = null;
      state.assessmentResult = null;
      render();
      break;
    case "circuit-state-view":
      state.circuitStateView = stateName;
      render();
      break;
    case "assessment-choice":
      state.assessmentSelection = option;
      render();
      break;
    case "submit-assessment": {
      const currentLesson = lesson();
      const variant = currentLesson.assessment[Math.min(state.assessmentVariant, currentLesson.assessment.length - 1)];
      const chosen = variant.options.find(o => o.id === state.assessmentSelection);
      const correct = Boolean(chosen?.correct);
      recordSimpleResult(currentLesson.id, correct);
      state.assessmentResult = { correct, misconception: chosen?.misconception || "Not quite: review the explanation and try again." };
      render();
      break;
    }
    case "retry-assessment-variant":
      state.assessmentVariant = 1;
      state.assessmentSelection = null;
      state.assessmentResult = null;
      render();
      break;
    case "retry-assessment-fresh": {
      const currentLesson = lesson();
      state.progress[currentLesson.id] = { status: "introduced", attempts: 0, wrongStreak: 0, independentAt: null };
      saveProgress();
      state.assessmentVariant = 0;
      state.assessmentSelection = null;
      state.assessmentResult = null;
      render();
      break;
    }
    case "lesson-refresh":
      state.assessmentSelection = null;
      state.assessmentResult = null;
      render();
      break;
    case "lesson-complete": {
      const currentLesson = lesson();
      const next = getNextLessonId(currentLesson.id);
      showToast(next ? "Lesson complete. Next lesson unlocked if its prerequisites are met." : "Lesson complete.");
      setRoute("curriculum");
      break;
    }
    case "ms-lesson-step":
      state.motorStarter.lessonStep = Number(index);
      render();
      break;
    case "ms-lesson-step-jump":
      state.motorStarter.lessonStep = Number(index);
      render();
      break;
    case "ms-trace-one":
      handleMsTrace("one", Number(index));
      break;
    case "ms-trace-two":
      handleMsTrace("two", Number(index));
      break;
    case "ms-reset-trace-one":
      state.motorStarter.diagramOneStep = -1;
      state.motorStarter.diagramOneFeedback = "";
      render();
      break;
    case "ms-to-signal-chain":
      state.motorStarter.lessonStep = 6;
      render();
      break;
    case "ms-simulation-choice":
      handleMsSimulation(option);
      break;
    case "ms-clear-simulation-hold":
      state.motorStarter.simulationHold = false;
      state.motorStarter.simulationStep = 0;
      render();
      break;
    case "ms-restart-simulation":
      state.motorStarter.simulationStep = 0;
      state.motorStarter.simulationComplete = false;
      state.motorStarter.simulationFeedback = "";
      render();
      break;
    case "ms-to-assessment":
      state.motorStarter.lessonStep = 7;
      render();
      break;
    case "ms-assessment-choice":
      state.motorStarter.assessmentSelection = option;
      render();
      break;
    case "ms-submit-assessment":
      submitMsAssessment();
      break;
    case "ms-remediation-choice":
      state.motorStarter.remediationSelection = option;
      render();
      break;
    case "ms-submit-remediation":
      submitMsRemediation();
      break;
    case "ms-finish":
      setRoute("curriculum");
      break;
    case "export-progress":
      exportProgress();
      break;
  }
});

function applyTextScale(next) {
  const value = Math.max(0.9, Math.min(1.3, next));
  document.documentElement.style.setProperty("--text-scale", value.toFixed(2));
  localStorage.setItem("academy-text-scale", value.toFixed(2));
  showToast(`Text size set to ${Math.round(value * 100)} percent.`);
}

document.getElementById("text-increase").addEventListener("click", () => {
  const current = Number(localStorage.getItem("academy-text-scale") || 1);
  applyTextScale(current + 0.1);
});

document.getElementById("text-decrease").addEventListener("click", () => {
  const current = Number(localStorage.getItem("academy-text-scale") || 1);
  applyTextScale(current - 0.1);
});

document.getElementById("motion-toggle").addEventListener("click", event => {
  const pressed = event.currentTarget.getAttribute("aria-pressed") !== "true";
  event.currentTarget.setAttribute("aria-pressed", String(pressed));
  event.currentTarget.textContent = pressed ? "Motion reduced" : "Reduce motion";
  document.documentElement.dataset.reducedMotion = String(pressed);
  localStorage.setItem("academy-reduced-motion", String(pressed));
  showToast(pressed ? "Movement effects reduced." : "Standard interface feedback restored.");
});

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.setAttribute("data-theme", theme);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const isDark = theme === "dark" || (theme !== "light" && systemDark);
  const toggle = document.getElementById("theme-toggle");
  toggle.setAttribute("aria-pressed", String(isDark));
  toggle.textContent = isDark ? "Light mode" : "Dark mode";
}

document.getElementById("theme-toggle").addEventListener("click", () => {
  const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
  const current = document.documentElement.getAttribute("data-theme") || (systemDark ? "dark" : "light");
  const next = current === "dark" ? "light" : "dark";
  localStorage.setItem("academy-theme", next);
  applyTheme(next);
  showToast(next === "dark" ? "Dark mode on." : "Light mode on.");
});

applyTheme(localStorage.getItem("academy-theme") || "auto");

const storedScale = Number(localStorage.getItem("academy-text-scale") || 1);
document.documentElement.style.setProperty("--text-scale", String(Math.max(0.9, Math.min(1.3, storedScale))));
const storedMotion = localStorage.getItem("academy-reduced-motion") === "true";
document.documentElement.dataset.reducedMotion = String(storedMotion);
document.getElementById("motion-toggle").setAttribute("aria-pressed", String(storedMotion));
document.getElementById("motion-toggle").textContent = storedMotion ? "Motion reduced" : "Reduce motion";

const initialRoute = location.hash.slice(1);
if (["welcome", "curriculum", "progress"].includes(initialRoute)) state.route = initialRoute;
render();

  </script>
</body>
</html>
